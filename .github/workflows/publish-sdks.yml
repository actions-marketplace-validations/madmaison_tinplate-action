name: Publish SDKs

on:
  workflow_dispatch:
  push:
    tags: ["sdk-v*"]

permissions:
  contents: read

jobs:
  publish-npm:
    name: Publish @tinplate/sdk to npm (OIDC Provenance)
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Verify ref is on origin/main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - name: Upgrade npm for OIDC Trusted Publishing
        run: npm install -g "npm@^11.5.1"
      - name: Verify sdk-v* tag matches SDK versions
        if: startsWith(github.ref, 'refs/tags/sdk-v')
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF#refs/tags/sdk-v}"
          NPM_VERSION=$(node -p 'JSON.parse(require("fs").readFileSync("packages/sdk/package.json","utf8")).version')
          PY_VERSION=$(python3 -c 'import tomllib; print(tomllib.load(open("packages/python-sdk/pyproject.toml","rb"))["project"]["version"])')
          echo "Tag: $TAG_VERSION | npm: $NPM_VERSION | pypi: $PY_VERSION"
          if [ "$TAG_VERSION" != "$NPM_VERSION" ] || [ "$TAG_VERSION" != "$PY_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) must match packages/sdk/package.json ($NPM_VERSION) and packages/python-sdk/pyproject.toml ($PY_VERSION)"
            exit 1
          fi
      - name: Build & smoke-test @tinplate/sdk
        run: |
          npx -p typescript@7.0.2 tsc -p packages/sdk/tsconfig.json
          node -e 'import("./packages/sdk/dist/index.js").then((m) => { if (typeof m.TinplateClient !== "function") throw new Error("Missing TinplateClient"); console.log("OK: @tinplate/sdk ESM bundle loaded"); })'
      - name: Generate CycloneDX SBOM
        run: |
          npm install --package-lock-only --ignore-scripts --prefix packages/sdk
          npm sbom --omit=dev --package-lock-only --sbom-format=cyclonedx --prefix packages/sdk > sbom.cdx.json
          rm -f packages/sdk/package-lock.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdk-sbom-cyclonedx
          path: sbom.cdx.json
          retention-days: 90
      - name: Publish to npm with Sigstore Provenance (OIDC)
        working-directory: packages/sdk
        run: npm publish --provenance --access public

  publish-pypi:
    name: Publish tinplate to PyPI (OIDC)
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Verify ref is on origin/main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Verify sdk-v* tag matches SDK versions
        if: startsWith(github.ref, 'refs/tags/sdk-v')
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF#refs/tags/sdk-v}"
          read -r NPM_VERSION PY_VERSION < <(python -c 'import json, tomllib; print(json.load(open("packages/sdk/package.json", encoding="utf-8"))["version"], tomllib.load(open("packages/python-sdk/pyproject.toml", "rb"))["project"]["version"])')
          echo "Tag: $TAG_VERSION | npm: $NPM_VERSION | pypi: $PY_VERSION"
          if [ "$TAG_VERSION" != "$NPM_VERSION" ] || [ "$TAG_VERSION" != "$PY_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) must match packages/sdk/package.json ($NPM_VERSION) and packages/python-sdk/pyproject.toml ($PY_VERSION)"
            exit 1
          fi
      - name: Run Python SDK unit tests
        run: python -m unittest discover -s packages/python-sdk/tests -v
      - name: Build Python distribution
        run: |
          python -m pip install "build==1.2.2.post1"
          python -m build packages/python-sdk
      - name: Publish to PyPI (OIDC Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: packages/python-sdk/dist
          skip-existing: false
