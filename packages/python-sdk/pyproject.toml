[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tinplate"
version = "1.1.8"
description = "Zero-dependency Python SDK for the Tinplate 32-API AI Safety, Security & Format Validation Edge Gateway."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{ name = "Tinplate" }]
keywords = ["tinplate", "ai-safety", "prompt-injection", "pii-redaction", "mcp", "guardrails"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
]
dependencies = []

[project.urls]
Homepage = "https://tinplate.dev/sdk"
Documentation = "https://tinplate.dev/docs"
Repository = "https://github.com/madmaison/tinplate-action"
Issues = "https://github.com/madmaison/tinplate-action/issues"
Security = "https://tinplate.dev/security"

[tool.setuptools.packages.find]
where = ["src"]
